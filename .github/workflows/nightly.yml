name: Nightly full test + dependency/security checks

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install pnpm
        run: npm install -g pnpm@11.7.0
      - name: Install project dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build --if-present
      - name: Test
        run: pnpm test --if-present
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install mathcore test deps
        working-directory: ./mathcore
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Run mathcore tests
        working-directory: ./mathcore
        run: pytest -q
      - name: NPM audit
        run: pnpm audit --audit-level=moderate || true
      - name: pip-audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit --progress-spinner off || true
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'table'

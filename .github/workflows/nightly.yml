name: Nightly full test + dependency/security checks

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read
  actions: read

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'
  # Must match packageManager in package.json.
  PNPM_VERSION: '11.7.0'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-node's pnpm cache needs pnpm on PATH, so install it first.
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm test
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install mathcore test deps
        working-directory: ./mathcore
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Run mathcore tests
        working-directory: ./mathcore
        run: pytest -q
      - name: NPM audit
        run: pnpm audit --audit-level=moderate || true
      - name: pip-audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit --progress-spinner off || true
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'table'

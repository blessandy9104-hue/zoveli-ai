name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  # pnpm 11 requires node:sqlite (Node 22.5+); Node 20 crashes pnpm itself
  # with ERR_UNKNOWN_BUILTIN_MODULE.
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'
  # Must match packageManager in package.json: pnpm 8 cannot read the
  # v9 lockfile (catalogs, allowBuilds) and fails with NO_LOCKFILE.
  PNPM_VERSION: '11.7.0'

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A mismatch here otherwise fails much later in E2E with a confusing
      # "Executable doesn't exist" error for the missing browser build.
      - name: Verify Playwright image matches dependency
        run: |
          installed="$(node -e "console.log(require('@playwright/test/package.json').version)")"
          image="$(sed -n 's|.*mcr\.microsoft\.com/playwright:v\([0-9][0-9.]*\)-noble.*|\1|p' .github/workflows/ci.yml | head -n1)"
          echo "Installed @playwright/test: $installed"
          echo "Pinned container image: $image"
          if [ -z "$image" ] || [ "$installed" != "$image" ]; then
            echo "::error::ci.yml pins Playwright '$image' but the workspace installs '$installed'; update the container tag to v${installed}-noble"
            exit 1
          fi

      - name: Verify release metadata
        run: pnpm run release:check

      - name: Run oxlint
        run: pnpm run lint

      # Type declarations resolve through built dist/ output, so the
      # workspace must be built before typechecking on a fresh clone.
      - name: Build packages
        run: pnpm run build

      - name: Run TypeScript type check
        run: pnpm run typecheck

      - name: Validate plugin contract
        run: pnpm run plugin:check

      - name: Performance budgets
        run: node scripts/perf-check.mjs

  unit-tests:
    name: Unit Tests
    # Windows leg exists because dev happens on Windows and platform bugs
    # (e.g. a piped-stdin hang that only reproduced on Linux CI) cut both
    # ways — both mainstream dev platforms are covered.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      # Enforce coverage on one leg only (cross-platform counters differ by a
      # few tenths of a percent); both legs still run the full suite.
      - name: Run unit tests (coverage gate)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm test -- --coverage --reporter=json --outputFile=test-results.json

      - name: Run unit tests
        if: matrix.os != 'ubuntu-latest'
        run: pnpm test -- --reporter=json --outputFile=test-results.json

  trust-eval:
    name: Trust Eval Gate
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install mathcore
        run: python -m pip install -e ./mathcore

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run trust evaluation
        # Exit code 1 when the relative trust score drops by 5% or more.
        run: >-
          node apps/cli/dist/cli.js eval
          --baseline eval/baseline.json
          --report eval/report.json

      - name: Upload trust report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-eval-report
          path: eval/report.json
          if-no-files-found: warn
          retention-days: 30

  integration-tests:
    name: Integration Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run integration tests
        run: pnpm test -- tests/integration --reporter=json --outputFile=integration-results.json

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    # The image bundles Chromium/Firefox/WebKit and their OS dependencies for
    # the pinned @playwright/test version, so no browser or apt install runs.
    # Keep the tag in sync with the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install mathcore (vendored in ./mathcore)
        # Use `python -m pip`: the Playwright container does not put a `pip`
        # shim on PATH for the non-root user.
        run: python -m pip install -e ./mathcore

      - name: Run mathcore fast tests (known answers + CLI)
        # Full adversarial/property suites are slow and run locally;
        # these 66 tests prove the vendored copy computes correctly.
        # The [test] extra provides pytest itself (not installed otherwise).
        run: |
          python -m pip install -e "./mathcore[test]"
          python -m pytest mathcore/tests/test_known_answers.py mathcore/tests/test_cli.py -q

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run E2E tests
        # Reporter outputs are configured in playwright.config.ts;
        # playwright has no --output-file flag.
        run: pnpm exec playwright test
        env:
          NODE_ENV: test
          # Makes child shutdowns print live-handle diagnostics to
          # stderr on hang (captured by the CLI e2e helper on timeout).
          ZOVELI_DEBUG: '1'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    # SARIF upload (CodeQL action) requires security-events: write.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --prod --audit-level=high

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Secret scanning
        # Filesystem mode: base/head diff scanning fails on push-to-main
        # ("BASE and HEAD commits are the same"). --only-verified fails
        # the build only on live, verifiable secrets.
        uses: trufflesecurity/trufflehog@v3.99.8
        with:
          path: ./
          # Pin the scanner image tag instead of the action's "latest" default.
          version: 3.99.8
          extra_args: --only-verified

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-scan]
    if: github.event_name != 'pull_request'
    # packages:write is required for the GHCR push on release runs
    # (push: true + docker/login with GITHUB_TOKEN); without it the push
    # fails with "denied: installation not allowed to Create package".
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.event_name == 'push' }}
            type=sha,prefix=

      - name: Build and push CLI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          load: ${{ github.event_name != 'release' }}
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test CLI image
        shell: bash
        run: |
          image="$(printf '%s\n' "$TAGS" | head -n 1)"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            docker pull "$image"
          fi
          echo "image=$image"
          version="$(docker run --rm "$image" node apps/cli/dist/cli.js --version)"
          echo "$version"
          [[ "$version" == zoveli* ]]
          docker run --rm "$image" node apps/cli/dist/cli.js plugins --json >/dev/null
          docker run --rm "$image" mathcore ops >/dev/null
          echo "CLI and mathcore smoke passed"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

      - name: Smoke test Compose data volume
        shell: bash
        run: |
          image="$(printf '%s\n' "$TAGS" | head -n 1)"
          ZOVELI_CLI_IMAGE="$image" docker compose -f docker/docker-compose.yml --profile smoke run --rm -T --no-deps --pull never --entrypoint node zoveli-cli \
            -e "require('node:fs').writeFileSync('/app/data/vault/.smoke','ok');require('node:fs').unlinkSync('/app/data/vault/.smoke')"
          echo "Compose data volume smoke passed"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

  build-docker-web:
    name: Build Web Image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    needs: [unit-tests, integration-tests, security-scan]
    if: github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}-web,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-web-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: docker-web-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-docker-web:
    name: Publish Web Image
    runs-on: ubuntu-latest
    needs: [build-docker-web]
    if: github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-web-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("ghcr.io/${GITHUB_REPOSITORY}-web@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect published manifest
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          image="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          echo "Published $image"
          docker buildx imagetools inspect "$image"

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    needs: [unit-tests]
    # contents:write is required on release runs: anchore/sbom-action
    # attaches the SBOM to the GitHub release (upload-release-assets).
    # Without it the step fails with "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate SBOM (SPDX + CycloneDX)
        uses: anchore/sbom-action@v0.24.3
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 30

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-docker, merge-docker-web]
    if: github.event_name == 'release'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release metadata
        run: node scripts/release-check.mjs --release --tag

      - name: Build packages
        run: pnpm run build

      # NOTE: npm publishing is intentionally disabled. The workspace
      # publishes nothing today: the @zoveli/* scope is unclaimed and
      # @changesets/cli is not installed. When the scope is claimed,
      # re-add a scoped publish step here
      # (e.g. `pnpm --filter "@zoveli/*" publish --access public`) behind
      # an NPM_TOKEN secret check — never `publish -r` unscoped.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          # Explicit file list (NOT docker/**/*): two files share the
          # basename prometheus.yml (docker/prometheus.yml and
          # docker/grafana/datasources/prometheus.yml) and the action
          # uploads by basename, so the glob collides and 404s the job.
          # dist/**/* is omitted: the workspace publishes nothing
          # (see NOTE above), so the pattern matches no files.
          files: |
            docker/Dockerfile
            docker/docker-compose.yml
            docker/prometheus.yml
            docker/grafana/dashboards/zoveli-overview.json
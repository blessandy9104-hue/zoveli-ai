name: Runtime Artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach archives to (e.g. 0.1.3); leave empty to build only'
        required: false
        type: string
      platforms:
        description: 'Platform(s) to build; use a single platform for targeted rebuilds'
        required: false
        default: all
        type: choice
        options:
          - all
          - linux-x64
          - linux-arm64
          - windows-x64
          - macos-arm64
          - macos-x64
  release:
    types: [published]
  pull_request:
    paths:
      - 'install/**'
      - 'apps/cli/**'
      - 'packages/**'
      - 'mathcore/**'
      - 'trusted_kb/**'
      - 'eval/**'
      - 'scripts/build-runtime.mjs'
      - 'scripts/build-mathcore-runtime.mjs'
      - 'scripts/smoke-runtime.mjs'
      - 'scripts/product-acceptance.mjs'
      - 'scripts/package-installers.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/runtime-artifacts.yml'
  push:
    branches: [main]
    paths:
      - 'install/**'
      - 'apps/cli/**'
      - 'packages/**'
      - 'mathcore/**'
      - 'trusted_kb/**'
      - 'eval/**'
      - 'scripts/build-runtime.mjs'
      - 'scripts/build-mathcore-runtime.mjs'
      - 'scripts/smoke-runtime.mjs'
      - 'scripts/product-acceptance.mjs'
      - 'scripts/package-installers.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/runtime-artifacts.yml'

permissions:
  contents: read

# Sovereign Distribution: official macOS and Windows installers are unsigned
# by design. See docs/INSTALL_GUIDE.md. No code-signing secrets are used.

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'
  PNPM_VERSION: '11.7.0'

jobs:
  setup:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          node -e '
            const all = [
              { runner: "ubuntu-22.04", platform: "linux-x64" },
              { runner: "ubuntu-22.04-arm", platform: "linux-arm64" },
              { runner: "windows-latest", platform: "windows-x64" },
              { runner: "macos-latest", platform: "macos-arm64" },
              { runner: "macos-15-intel", platform: "macos-x64" },
            ];
            const selected = process.env.PLATFORMS;
            const include = selected === "all" ? all : all.filter((entry) => entry.platform === selected);
            if (include.length === 0) {
              console.error(`unknown platform: ${selected}`);
              process.exit(1);
            }
            console.log(`matrix=${JSON.stringify({ include })}`);
          ' >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: setup
    runs-on: ${{ matrix.runner }}
    # The Linux arm64 leg builds z3-solver from source for the glibc 2.35
    # floor, which is the slowest step in the matrix.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install arm64 mathcore build tools
        if: matrix.platform == 'linux-arm64'
        run: |
          # z3-solver has no manylinux aarch64 wheel for this glibc floor;
          # build it from source on the Ubuntu 22.04 arm64 runner.
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install packaging tools
        run: python -m pip install --disable-pip-version-check pyinstaller -e ./mathcore

      - name: Build mathcore runtime
        run: node scripts/build-mathcore-runtime.mjs

      - name: Build application runtime
        run: node scripts/build-runtime.mjs

      - name: Smoke test runtime
        run: node scripts/smoke-runtime.mjs
        shell: bash

      - name: Primary installer acceptance (Linux)
        if: runner.os == 'Linux'
        run: |
          ARCHIVE=$(find release -maxdepth 1 -name 'zoveli-*.tar.gz' | head -n 1)
          test -n "$ARCHIVE"
          sh scripts/install-acceptance.sh --archive "$ARCHIVE"

      - name: Clean-install acceptance (Unix)
        if: runner.os != 'Windows'
        run: |
          ARCHIVE=$(find release -maxdepth 1 -name 'zoveli-*.tar.gz' | head -n 1)
          node scripts/product-acceptance.mjs --archive "$ARCHIVE" --report "acceptance-${{ matrix.platform }}.json"

      - name: Clean-install acceptance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = (Get-ChildItem release -Filter zoveli-*.tar.gz | Select-Object -First 1).FullName
          if (-not $archive) { throw 'no runtime archive found under release/' }
          node scripts/product-acceptance.mjs --archive "$archive" --report "acceptance-${{ matrix.platform }}.json"

      - name: Package unsigned macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: node scripts/package-installers.mjs

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\Inno Setup 6'

      - name: Package unsigned Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/package-installers.mjs

      - name: Attest runtime archive
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.dmg
            release/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: zoveli-runtime-${{ matrix.platform }}
          path: |
            release/*.tar.gz
            release/*.sha256
            acceptance-*.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: zoveli-installer-${{ matrix.platform }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: zoveli-installer-${{ matrix.platform }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach runtime artifacts
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zoveli-runtime-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: zoveli-installer-*
          path: installer-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v1
        with:
          # download-artifact keeps the artifact's `release/` prefix, so the
          # archives are one level below release-assets/.
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.sha256
            installer-assets/**/*.dmg
            installer-assets/**/*.exe

name: Runtime Artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach archives to (e.g. 0.1.2); leave empty to build only'
        required: false
        type: string
  release:
    types: [published]
  pull_request:
    paths:
      - 'install/**'
      - 'apps/cli/**'
      - 'packages/**'
      - 'mathcore/**'
      - 'scripts/build-runtime.mjs'
      - 'scripts/build-mathcore-runtime.mjs'
      - 'scripts/smoke-runtime.mjs'
      - 'scripts/product-acceptance.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/runtime-artifacts.yml'
  push:
    branches: [main]
    paths:
      - 'install/**'
      - 'apps/cli/**'
      - 'packages/**'
      - 'mathcore/**'
      - 'scripts/build-runtime.mjs'
      - 'scripts/build-mathcore-runtime.mjs'
      - 'scripts/smoke-runtime.mjs'
      - 'scripts/product-acceptance.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/runtime-artifacts.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'
  PNPM_VERSION: '11.7.0'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install packaging tools
        run: python -m pip install --disable-pip-version-check pyinstaller -e ./mathcore

      - name: Build mathcore runtime
        run: node scripts/build-mathcore-runtime.mjs

      - name: Build application runtime
        run: node scripts/build-runtime.mjs

      - name: Smoke test runtime
        run: node scripts/smoke-runtime.mjs
        shell: bash

      - name: Clean-install acceptance (Unix)
        if: runner.os != 'Windows'
        run: |
          ARCHIVE=$(find release -maxdepth 1 -name '*.tar.gz' | head -n 1)
          node scripts/product-acceptance.mjs --archive "$ARCHIVE" --report "acceptance-${{ matrix.os }}.json"

      - name: Clean-install acceptance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = (Get-ChildItem release -Filter *.tar.gz | Select-Object -First 1).FullName
          node scripts/product-acceptance.mjs --archive $archive --report "acceptance-${{ matrix.os }}.json"

      - name: Attest runtime archive
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: zoveli-runtime-${{ matrix.os }}
          path: |
            release/*.tar.gz
            release/*.sha256
            acceptance-*.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach runtime artifacts
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zoveli-runtime-*
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v1
        with:
          # download-artifact keeps the artifact's `release/` prefix, so the
          # archives are one level below release-assets/.
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.sha256

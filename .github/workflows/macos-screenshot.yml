name: macOS Screenshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture Gatekeeper prompt
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Download Intel disk image
        run: |
          curl -fL --retry 3 -o zoveli.dmg \
            https://github.com/blessandy9104-hue/zoveli-ai/releases/download/v0.1.3/zoveli-0.1.3-macos-x64-setup.dmg
          xattr -w com.apple.quarantine "0083;00000000;Safari;" zoveli.dmg
          xattr -l zoveli.dmg

      - name: Copy runtime with quarantine
        run: |
          hdiutil attach zoveli.dmg -nobrowse -mountpoint /tmp/zoveli-dmg
          mkdir -p "$HOME/Applications"
          ditto /tmp/zoveli-dmg "$HOME/Applications/zoveli-0.1.3-macos-x64"
          find "$HOME/Applications/zoveli-0.1.3-macos-x64" -type f -print0 \
            | xargs -0 -I{} xattr -w com.apple.quarantine "0083;00000000;Safari;" "{}"
          xattr -l "$HOME/Applications/zoveli-0.1.3-macos-x64/zoveli"

      - name: Open launcher and capture
        run: |
          set +e
          open "$HOME/Applications/zoveli-0.1.3-macos-x64/zoveli" &
          sleep 8
          screencapture -x gatekeeper-x64.png
          file gatekeeper-x64.png
          ps aux | grep -E 'zoveli|Terminal' | grep -v grep || true

      - name: Upload capture
        uses: actions/upload-artifact@v4
        with:
          name: macos-gatekeeper-x64
          path: gatekeeper-x64.png
          if-no-files-found: error
          retention-days: 7

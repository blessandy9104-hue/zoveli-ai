name: macOS Screenshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture Gatekeeper prompt
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Check display capture
        run: |
          screencapture -x desktop.png || echo "screencapture failed"
          file desktop.png || true

      - name: Download unsigned disk image
        run: |
          curl -fL --retry 3 -o zoveli.dmg \
            https://github.com/blessandy9104-hue/zoveli-ai/releases/download/v0.1.3/zoveli-0.1.3-macos-arm64-setup.dmg
          xattr -w com.apple.quarantine "0083;00000000;Safari;" zoveli.dmg
          xattr -l zoveli.dmg

      - name: Open disk image and capture
        run: |
          open zoveli.dmg || echo "open failed"
          sleep 6
          screencapture -x gatekeeper.png || echo "screencapture failed"
          file gatekeeper.png || true
          hdiutil info | head -40 || true

      - name: Upload captures
        uses: actions/upload-artifact@v4
        with:
          name: macos-gatekeeper-capture
          path: |
            desktop.png
            gatekeeper.png
          if-no-files-found: warn
          retention-days: 7

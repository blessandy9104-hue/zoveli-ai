name: Installer Check

# Validates the opencode-style one-line installer on PRs without privileged
# operations (no sudo). Uses the runner's preinstalled git/curl/python/node
# plus setup-node/setup-python/setup-pnpm. Also builds the CLI and browser-UI
# Docker images so the mathcore z3-solver fix and the Docker fallback installer
# are proven on PRs, because the main CI `build-docker` jobs are gated with
# `if: github.event_name != 'pull_request'` and therefore never run on pull
# requests.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: ['fix/installer/*']

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'
  PNPM_VERSION: '11.7.0'

permissions:
  contents: read

jobs:
  installer-smoke:
    name: Installer Smoke (no sudo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bash syntax check
        run: |
          sh -n install/install.sh
          sh -n install/install-docker.sh
          sh -n scripts/install-acceptance.sh
          sh -n scripts/docker-acceptance.sh
          bash -n install/install-zoveli.sh
          bash -n install/install-zoveli-runtime.sh

      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            -S warning -s sh install/install.sh
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            -S warning -s sh install/install-docker.sh
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            -S warning -s sh scripts/install-acceptance.sh
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            -S warning -s sh scripts/docker-acceptance.sh
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            -S warning install/install-zoveli.sh install/install-zoveli-runtime.sh

      - name: Installer packaging script check
        run: |
          node --check scripts/package-installers.mjs
          node scripts/package-installers.mjs --help

      - name: Installer help flag
        run: |
          sh install/install.sh --help
          sh install/install-docker.sh --help
          bash install/install-zoveli.sh --help
          bash install/install-zoveli-runtime.sh --help
          ZOVELI_VERSION=0.1.3 bash install/install-zoveli-runtime.sh --check --dir "$GITHUB_WORKSPACE"

      - name: Minimal-container fail-early
        run: |
          set +e
          output=$(docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work alpine:3.20 \
            sh install/install.sh --yes --archive /nonexistent.tar.gz 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "install.sh unexpectedly succeeded in a container without bash"
            exit 1
          fi
          case "$output" in
            *"Missing required command: bash"*) ;;
            *)
              echo "install.sh failed for an unexpected reason"
              exit 1
              ;;
          esac

      - name: Run installer (non-privileged, reuses checkout)
        run: bash install/install-zoveli.sh --yes --dir "$GITHUB_WORKSPACE" --skip-update
        env:
          ZOVELI_SKIP_PREREQ_INSTALL: '1'

      - name: Verify install artifacts
        run: |
          test -f .zoveli-install-done
          test -d node_modules
          test -d apps/cli/dist
          source .venv/bin/activate
          python -c "import mathcore; print('mathcore OK')"
          node apps/cli/dist/cli.js --version
          node apps/cli/dist/cli.js --help

  powershell-install:
    name: PowerShell Install (no sudo)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Parse installer scripts
        shell: pwsh
        run: |
          foreach ($file in @('install/install-zoveli.ps1', 'install/install-zoveli-runtime.ps1')) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
            Write-Output "$file parses clean"
          }

      - name: Runtime installer version check
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install\install-zoveli-runtime.ps1 -Check -Version 0.1.3 -Dir "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw "runtime installer check exited with $LASTEXITCODE" }

      - name: Run installer (Windows PowerShell 5.1, reuses checkout)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install\install-zoveli.ps1 -Yes -Dir "$env:GITHUB_WORKSPACE" -SkipUpdate
          if ($LASTEXITCODE -ne 0) { throw "installer exited with $LASTEXITCODE" }

      - name: Verify install artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path '.zoveli-install-done')) { throw 'missing install marker' }
          if (-not (Test-Path 'node_modules')) { throw 'missing node_modules' }
          if (-not (Test-Path 'apps/cli/dist')) { throw 'missing CLI build output' }
          & .\.venv\Scripts\python.exe -c "import mathcore; print('mathcore OK')"
          if ($LASTEXITCODE -ne 0) { throw 'mathcore import failed' }
          node apps/cli/dist/cli.js --version
          if ($LASTEXITCODE -ne 0) { throw 'CLI --version failed' }
          node apps/cli/dist/cli.js --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI --help failed' }

      - name: Verify installer is idempotent
        shell: pwsh
        run: |
          $output = powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install\install-zoveli.ps1 -Yes -Dir "$env:GITHUB_WORKSPACE" -SkipUpdate 6>&1 | Out-String
          Write-Output $output
          if ($LASTEXITCODE -ne 0) { throw "second installer run exited with $LASTEXITCODE" }
          if ($output -notmatch 'Already installed') { throw 'second run did not use the install marker' }

  docker-build:
    name: Docker Build (CLI, no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CLI image (proves z3-solver wheel builds)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: zoveli-cli:installer-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-web:
    name: Docker Web (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: amd64
          - runner: ubuntu-22.04-arm
            platform: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Native builds (no QEMU): the arm64 runner proves the trixie base can
      # install the z3-solver manylinux_2_38_aarch64 wheel.
      - name: Build browser-UI image (native ${{ matrix.platform }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: zoveli-web:acceptance
          cache-from: type=gha,scope=docker-web-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=docker-web-${{ matrix.platform }}

      - name: Docker fallback acceptance
        run: sh scripts/docker-acceptance.sh --image zoveli-web:acceptance --port 18080

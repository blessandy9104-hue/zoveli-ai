# mathcore MCP integration (from mathcore harness)
- insert:
    - id: mathcore-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: mathcore
        transport: stdio
        command: mathcore-mcp
        cwd: !!js process.cwd()
        env:
          MATHCORE_AUDIT: !!js >-
            process.env.MATHCORE_AUDIT?.trim() || 
            process.getBuiltinModule('node:path').join(
              process.getBuiltinModule('node:os').homedir(), 
              '.mathcore', 
              'audit.jsonl'
            )

# Knowledge vault filesystem access
- insert:
    - id: vault-fs
      name: '@deepseek-ai/dsh-fs-local'
      config:
        root: !!js >-
          process.env.ZOVELI_VAULT_PATH || 
          process.getBuiltinModule('node:path').join(process.cwd(), 'knowledge-vault')
        readOnly: false

# Session persistence for long-term memory (real package:
# deepseek-agent-harness-merged/packages/session/session-persistence-jsonl)
- insert:
    - id: session-persistence
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        directory: !!js >-
          process.getBuiltinModule('node:path').join(
            process.getBuiltinModule('node:os').homedir(), 
            '.personal-assistant', 
            'sessions'
          )

# Settings for personal assistant
- insert:
    - id: assistant-settings
      name: '@deepseek-ai/dsh-settings'
      config:
        defaults:
          assistant:
            vaultPath: ./knowledge-vault
            autoSave: true
            mathVerification: required
            defaultModel: deepseek-chat
            maxTurns: 50


packages:
  # Self-contained: zoveli ships zero upstream-harness workspace members.
  # Cordis profile configs still reference upstream bundle names for future
  # launcher integration, but nothing is installed from there.
  - packages/*
  - apps/*

# esbuild (bundler used by tsdown/vitest) needs its native binary
# postinstall. node-pty/koffi remain allowlisted (same reviewed decision as
# upstream): if any transitive dep ships them, their scripts are legitimate
# (ConPTY setup / FFI bindings), and the entries are inert otherwise.
allowBuilds:
  esbuild: true
  koffi: true
  node-pty: true
  # No-op install scripts we do not need (same reviewed decision as
  # upstream): denying still installs the packages, it just never runs
  # their scripts. pnpm 11 hard-fails when a script has no decision.
  '@google/genai': false
  protobufjs: false

catalog:
  typescript: ^5.3.0
  vitest: ^4.1.12
  "@types/node": ^20.10.0
  oxlint: ^0.18.1

minimumReleaseAgeExclude:
  - rolldown-plugin-dts@0.28.7
  - tsdown@0.23.1

# tsdown@0.3.x depends on rolldown@nightly, a dist-tag that no longer exists
# on npm (ERR_PNPM_NO_MATCHING_VERSION). Pin every workspace occurrence to a
# modern tsdown whose rolldown dependency is a stable range.
overrides:
  tsdown: ^0.23.1
  # Patched Vite (all GHSA advisories fixed in 6.4.5). Vitest 4 accepts Vite 6;
  # Vite 8 currently lacks the `vite/module-runner` export Vitest imports.
  vite: 6.4.5

services:
  # Main Zoveli CLI application
  zoveli-cli:
    image: ${ZOVELI_CLI_IMAGE:-zoveli-cli:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: zoveli-cli
    volumes:
      # Named volume inherits /app/data ownership from the image, so the
      # non-root zoveli user can write the vault, sessions and audit log.
      - zoveli-data:/app/data
      - ../knowledge-vault:/app/knowledge-vault:ro
    environment:
      # Free local chat: points the app at the `ollama` service below.
      # Bring it up with:
      # docker compose -f docker/docker-compose.yml --profile local-llm up ollama
      # then: docker exec zoveli-ollama ollama pull qwen3:4b
      - ZOVELI_OLLAMA_URL=http://ollama:11434
    stdin_open: true
    tty: true
    profiles:
      - cli

  # Ollama for local LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: zoveli-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    # CPU inference works out of the box. To use an NVIDIA GPU, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    profiles:
      - local-llm

  # PostgreSQL for session persistence (optional)
  postgres:
    image: postgres:16-alpine
    container_name: zoveli-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=zoveli
      - POSTGRES_USER=zoveli
      - POSTGRES_PASSWORD=zoveli
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoveli -d zoveli"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: zoveli-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - redis

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: zoveli-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: zoveli-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    profiles:
      - monitoring

volumes:
  zoveli-data:
  ollama-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

services:
  # Interactive Zoveli CLI terminal; local tools run without network services.
  zoveli-cli:
    image: ${ZOVELI_CLI_IMAGE:-zoveli-cli:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: zoveli-cli
    entrypoint: ["dumb-init", "--", "node", "apps/cli/dist/cli.js"]
    command: []
    restart: "no"
    healthcheck:
      disable: true
    stdin_open: true
    tty: true
    volumes:
      - zoveli-data:/app/data
    environment:
      # The Ollama container is attached to the same Compose network.
      - ZOVELI_OLLAMA_URL=http://ollama:11434
      - ZOVELI_OLLAMA_MODEL=${ZOVELI_OLLAMA_MODEL:-qwen3:4b}
      - ZOVELI_CHAT_TIMEOUT_MS=600000
      - ZOVELI_VAULT_PATH=/app/data/vault
      - MATHCORE_AUDIT=/app/data/audit/audit.jsonl
      - MATHCORE_VERIFIERS=${MATHCORE_VERIFIERS:-}
      - MATHCORE_TRUSTED_KB=${MATHCORE_TRUSTED_KB:-}
      - ZOVELI_PROVIDER=${ZOVELI_PROVIDER:-}
      - ZOVELI_MODEL=${ZOVELI_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      # Clear the obsolete variable present in the published runtime image.
      - ZOVELI_SESSION_PATH=
    profiles:
      - cli
      - smoke

  # Optional local Ollama chat; it is not needed to use local CLI tools.
  ollama:
    image: ollama/ollama:0.40.15
    container_name: zoveli-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_CONTEXT_LENGTH=2048
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=24h
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    profiles:
      - cli
      - local-llm

  # Optional PostgreSQL for session persistence.
  postgres:
    image: postgres:16-alpine
    container_name: zoveli-postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=zoveli
      - POSTGRES_USER=zoveli
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoveli -d zoveli"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

  # Optional Redis cache.
  redis:
    image: redis:7-alpine
    container_name: zoveli-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - redis

  # Optional monitoring services.
  prometheus:
    image: prom/prometheus:v2.54
    container_name: zoveli-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:11.2
    container_name: zoveli-grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
    secrets:
      - grafana_admin_password
    profiles:
      - monitoring

volumes:
  zoveli-data:
  ollama-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD

services:
  # Interactive Zoveli CLI terminal; local tools run without network services.
  zoveli-cli:
    image: ${ZOVELI_CLI_IMAGE:-zoveli-cli:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: zoveli-cli
    entrypoint: ["dumb-init", "--", "node", "apps/cli/dist/cli.js"]
    command: []
    restart: "no"
    healthcheck:
      disable: true
    stdin_open: true
    tty: true
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - zoveli-data:/app/data
      - ../knowledge-vault:/app/knowledge-vault:ro
    environment:
      # The Ollama container is attached to the same Compose network.
      - ZOVELI_OLLAMA_URL=http://ollama:11434
      - ZOVELI_OLLAMA_MODEL=qwen3.5:0.8b
      - ZOVELI_CHAT_TIMEOUT_MS=600000
      - ZOVELI_VAULT_PATH=/app/data/vault
      - MATHCORE_AUDIT=/app/data/audit/audit.jsonl
      # Clear the obsolete variable present in the published runtime image.
      - ZOVELI_SESSION_PATH=
    profiles:
      - cli

  # Optional local Ollama chat; it is not needed to use local CLI tools.
  ollama:
    image: ollama/ollama:latest
    container_name: zoveli-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_CONTEXT_LENGTH=2048
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=24h
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    profiles:
      - cli
      - local-llm

  # Optional PostgreSQL for session persistence.
  postgres:
    image: postgres:16-alpine
    container_name: zoveli-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=zoveli
      - POSTGRES_USER=zoveli
      - POSTGRES_PASSWORD=zoveli
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoveli -d zoveli"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

  # Optional Redis cache.
  redis:
    image: redis:7-alpine
    container_name: zoveli-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - redis

  # Optional monitoring services.
  prometheus:
    image: prom/prometheus:latest
    container_name: zoveli-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: zoveli-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    profiles:
      - monitoring

volumes:
  zoveli-data:
  ollama-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
